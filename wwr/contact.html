<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Whitewater Rafting Company</title>
    <meta name="description" content="Send your questions by filling the following form.">
    <meta name="author" content="Victoria Santa Cruz">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-dryoarlogo.png" alt="logo for the site">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>White Water Rafting Company</h1>
        <section class="contact-info">
            <p>Whitewater Rafting Company</p>
            <p>123 Main River Street, Kolob California</p>
            <p>📞 (555) 123-4567</p>
            <p>✉️ info@whitewater.com</p>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.webp" alt="Guide">
                <figcaption>Ana – Lead Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Customer service representative">
                <figcaption>Joseph– Customer Support</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.webp" alt="Customer service representative">
                <figcaption>Victoria– Customer Support</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <fieldset>
                    <legend>Reason for Contact</legend>

                    <label>
                        <input type="radio" id="radio" name="reason" value="general">
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" id="radio" name="reason" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" id="radio" name="reason" value="support">
                        Support
                    </label>
                </fieldset>

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <label>
                    <input type="checkbox" id="checkbox" name="newsletter">
                    Subscribe to our newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>


    </main>

    <footer>
        <p>&copy; 2026 Whitewater Rafting Company| Victoria Santa Cruz</p>
        <nav class="socialmedia">
            <a href="https://www.instagram.com/">
                <img src="images/instagram.png" alt="Instagram logo">
            </a>
            <a href="https://www.facebook.com/">
                <img src="images/facebook.png" alt="Facebook logo">
            </a>
            <a href="https://www.linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn logo">
            </a>
        </nav>


    </footer>
</body>

</html>
