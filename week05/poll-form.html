<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <form>
            <label for="fullname">Full name</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">User email</label>
            <input type="email" id="useremail" name="useremail" required>
            <label for="Browser">What is your favorite browser?</label>
            <select name="Browser" id="Browser">
                <option value="Google">Google</option>
                <option value="Firefox">Firefox</option>
                <option value="Edge">Edge</option>
            </select>
            <label><input type="checkbox" id="pet" name="pet">Do you have a household pet?</label>

            <label for="places">List the places you have lived</label>
            <textarea id="places" name="places" rows="4"
              placeholder="Rivera, Brasil, Montevideo"></textarea>
            <button type="submit">Submmit Poll</button>

        </form>
    </main>

</body>
<footer>

</footer>

</html>
